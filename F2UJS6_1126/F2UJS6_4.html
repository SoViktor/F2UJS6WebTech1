<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>jQuery feladatok</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="4.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #formBox {
            width: 250px;
            padding: 15px;
            background-color: #cfe0f1;
            border: 1px solid #aac;
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input {
            width: 95%;
            padding: 4px;
            margin-bottom: 10px;
        }
        button {
            margin-right: 10px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<h1>jQuery feladatok</h1>

<p id="p1">A jQuery egy JavaScript programozói könyvtár, amelyet John Resig fejlesztett.</p>
<p id="p2">Elterjedtnek tekinthető, segítségével könnyen bejárható egy HTML oldal DOM-ja.</p>
<p id="p3">Ellenőrizni és módosítani is lehet HTML elemeket. Szinte minden jellegű művelet lehetséges.</p>

<button id="hideP">Elrejt</button>
<button id="showP">Megjelenít</button>
<button id="toggleP">Elrejt/Megjelenít</button>

<br><br>

<div id="formBox">
    <h3>Űrlap</h3>

    <label>Név:
        <input type="text">
    </label>

    <label>E-mail:
        <input type="email">
    </label>

    <label>Jelszó:
        <input type="password">
    </label>

    <button id="submitBtn">Jelentkezés</button>
</div>

<button id="op1">Áttetszőség = 0.1</button>
<button id="op5">Áttetszőség = 0.5</button>
<button id="op8">Áttetszőség = 0.8</button>

<br><br>

<button id="hideForm">Elrejt</button>
<button id="showForm">Megjelenít</button>
<button id="toggleForm">Elrejt/Megjelenít</button>

</body>
</html>
